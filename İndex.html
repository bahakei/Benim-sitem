<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baha'nın Sitesi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .kutu {
            padding: 40px 25px;
            max-width: 600px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            color: #bbb;
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <div class="kutu">
        <h1>Merhaba 👋</h1>

        <p>
            Burası benim ilk web sitem.
            Daha yeni başlıyorum 😎
        </p>

        <button onclick="mesajGoster()">
            Bana Tıkla
        </button>
    </div>

    <script>
        function mesajGoster() {
            alert("Site çalışıyor! 😎🔥");
        }
    </script>

</body>
</html>
